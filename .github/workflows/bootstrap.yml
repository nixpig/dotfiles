# Sets up fresh machines the way the README does (install mise, `mise bootstrap
# --from` this repo), runs it a second time to check it changes nothing, then runs
# `mise run check` in a login shell.
name: bootstrap

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise downloads ~30 tools from GitHub releases; unauthenticated API calls are rate-limited.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    name: ${{ matrix.image }} (${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:trixie", "ubuntu:24.04"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Prepare a fresh machine
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo curl ca-certificates git
          git config --system --add safe.directory '*'
          useradd -m -u 1001 -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          rm -f /home/tester/.bashrc /home/tester/.profile /home/tester/.bash_logout

      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Bootstrap
        run: |
          git -C dotfiles checkout -q -B ci-under-test
          su -w GITHUB_TOKEN - tester -c "
            curl -fsSL https://mise.run | sh
            ~/.local/bin/mise bootstrap --yes --from 'file://$GITHUB_WORKSPACE/dotfiles?ref=ci-under-test' --from-dir ~/.dotfiles --config-dir mise"

      - name: Bootstrap again (should change nothing)
        run: su -w GITHUB_TOKEN - tester -c 'bash -lc "mise bootstrap --yes"'

      - name: Check
        run: su -w GITHUB_TOKEN - tester -c 'bash -lc "mise run check"'

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Leaves out mas: the App Store needs an interactive sign-in, which CI can't do.
      MISE_SYSTEM_PACKAGES_MANAGERS: brew,brew-cask
    steps:
      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Bootstrap
        run: |
          git -C dotfiles checkout -q -B ci-under-test
          curl -fsSL https://mise.run | sh
          # --force-dotfiles: the runner image ships its own ~/.bashrc and friends.
          ~/.local/bin/mise bootstrap --yes --force-dotfiles --from "file://$GITHUB_WORKSPACE/dotfiles?ref=ci-under-test" --from-dir ~/.dotfiles --config-dir mise

      - name: Bootstrap again (should change nothing)
        run: bash -lc "mise bootstrap --yes"

      - name: Check
        run: bash -lc "mise run check"
