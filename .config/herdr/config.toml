# ~/.config/herdr/config.toml
onboarding = false

[ui]
status_indicators = "dots"
tab_bar_position = "bottom"
# pane_borders = "always"
accent = "blue"
prompt_new_tab_name = false
sidebar_min_width = 32
tab_bar_right_separator = " "
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "cores=$(sysctl -n hw.ncpu); ps -A -o %cpu | awk -v c=\"$cores\" '{s+=$1} END {printf \" %.1f%%\", s/c}'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "vm_stat | awk '/Pages active/ {active=$3} /Pages wired/ {wired=$3} /Pages speculative/ {spec=$3} END { total=active+wired+spec; printf \" %.1fGB\", (total*4096)/(1024^3) }'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "mem=$(pmset -g batt | grep -Eo \"\\\\d+%\" | cut -d% -f1); echo 󰁽$mem%", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "│ %Y-%m-%d %T" },
]

[ui.toast]
delivery = "system"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch"],
]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
settings = "prefix+shift+s"
workspace_picker = "prefix+s"
# switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+shift+1..9"
prefix = "ctrl+space"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
split_horizontal = "prefix+minus"
split_vertical = "prefix+\\"

# herdr-beams plugin actions (see the plugin README)
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-beams.bind-new-beam"
description = "Bind a new beam to a workspace"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "herdr-beams.refresh-beam-labels"
description = "Refresh beam labels"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "herdr-beams.show-beams"
description = "Show beams table"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"
