# Linux (Debian / Ubuntu / Raspberry Pi OS) only. Loaded on Linux because
# miserc.toml turns on auto_env.

[tools]
# btop from its own release builds, not apt: Debian/Ubuntu's 1.3.x rewrites
# btop.conf in its own format and drops save_config_on_exit (a 1.4 setting), so
# it churns against the Mac's Homebrew 1.4.x. Go back to apt once it has 1.4+.
btop = "latest"

[bootstrap.packages]
# Base and build
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:git" = "latest"
"apt:unzip" = "latest"
"apt:python3" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:gawk" = "latest"
"apt:pkg-config" = "latest"
"apt:libfido2-dev" = "latest"  # FIDO2 library and headers, for building Teleport
"apt:lua5.1" = "latest"
"apt:luajit" = "latest"
"apt:luarocks" = "latest"

# C tooling (Neovim's C LSP and formatter, compile_commands.json, debugging, leak checks).
# clangd from apt, not Mason: Mason's clangd has no Linux arm64 build.
"apt:clangd" = "latest"
"apt:clang-format" = "latest"
"apt:clang-tidy" = "latest"
"apt:bear" = "latest"         # compile_commands.json for Make projects: `bear -- make`
"apt:gdb" = "latest"
"apt:valgrind" = "latest"

# Shell and CLI (the rest are mise tools in config.toml)
"apt:eza" = "latest"
"apt:ranger" = "latest"
"apt:tmux" = "latest"
"apt:tree" = "latest"

# Network
"apt:lsof" = "latest"
"apt:nmap" = "latest"
"apt:arp-scan" = "latest"

# Media and certificates
"apt:ffmpeg" = "latest"
"apt:libnss3-tools" = "latest"   # lets `mkcert -install` add its CA to Firefox/Chromium

# Docker Engine, from Docker's repo (below)
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"

# Azure CLI: from Microsoft's repo on Ubuntu (below); Debian's own package elsewhere,
# because Microsoft has no repo for Debian 13 (trixie).
"apt:azure-cli" = "latest"

# --------------------------------------------------------- apt sources ---
# Written as files rather than [bootstrap.apt.sources] because the repo URL depends
# on the distro (debian vs ubuntu), which only a template can work out.
# The keys are committed in files/; check them with `gpg --show-keys files/*.asc`:
#   docker.asc     9DC8 5822 9FC7 DD38 854A  E2D8 8D81 803C 0EBF CD88
#   microsoft.asc  BC52 8686 B50D 79E3 39D3  721C EB3E 94AD BE12 29CF

[bootstrap.directories."/etc/apt/keyrings"]
mode = "0755"
phase = "pre-packages"

[bootstrap.files."/etc/apt/keyrings/docker.asc"]
source = "files/docker.asc"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/docker.list"]
phase = "pre-packages"
template = true
content = """
deb [arch={{ exec(command="dpkg --print-architecture") }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ exec(command=". /etc/os-release; case \\"$ID $ID_LIKE\\" in *ubuntu*) echo ubuntu ;; *) echo debian ;; esac") }} {{ exec(command=". /etc/os-release; echo ${UBUNTU_CODENAME:-$VERSION_CODENAME}") }} stable
"""

[bootstrap.files."/etc/apt/keyrings/microsoft.asc"]
source = "files/microsoft.asc"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/azure-cli.sources"]
phase = "pre-packages"
template = true
remove_empty = true           # renders empty (so no file) on Debian
content = """
{%- set codename = exec(command=". /etc/os-release; case \\"$ID $ID_LIKE\\" in *ubuntu*) echo ${UBUNTU_CODENAME:-$VERSION_CODENAME} ;; esac") -%}
{%- if codename -%}
Types: deb
URIs: https://packages.microsoft.com/repos/azure-cli/
Suites: {{ codename }}
Components: main
Architectures: {{ exec(command="dpkg --print-architecture") }}
Signed-By: /etc/apt/keyrings/microsoft.asc
{% endif -%}
"""

[bootstrap.hooks]
# Files don't refresh apt's package lists, so the sources above need this before
# packages are installed. Runs on every bootstrap; it's quick.
pre-packages = "sudo apt-get update -qq"
