# macOS only. Loaded on macOS because miserc.toml turns on auto_env.
# mise installs formulae and casks itself, into /opt/homebrew; the `brew` command
# isn't needed (but sees them if it's installed).
# Not needed because macOS already has them: curl, lsof, make (Xcode Command Line Tools).
# Xcode's clang is also there, but it can't build wasm32; brew:llvm below can.

[tools]
mas = "latest"                # for the mas: package below

[bootstrap.packages]
# Shell and CLI (the rest are mise tools in config.toml)
"brew:btop" = "latest"
"brew:eza" = "latest"
"brew:gawk" = "latest"
"brew:ranger" = "latest"
"brew:tmux" = "latest"
"brew:wget" = "latest"

# Build
"brew:cmake" = "latest"
"brew:gcc" = "latest"         # real GCC, installed as gcc-NN; plain `gcc` on macOS is clang
"brew:llvm" = "latest"        # LLVM clang, which can build wasm32 (Apple's can't), plus clangd, clang-format, clang-tidy; keg-only, on PATH via .bashrc
"brew:bear" = "latest"        # compile_commands.json for Make projects: `bear -- make`
# No gdb or valgrind: neither supports Apple Silicon. Neovim debugs C/Rust with codelldb.
"brew:luajit" = "latest"
"brew:luarocks" = "latest"
"brew:pkgconf" = "latest"     # provides pkg-config (the formula was renamed)
"brew:libfido2" = "latest"    # for building Teleport

# Network
"brew:arp-scan" = "latest"
"brew:nmap" = "latest"

# Media, certificates, cloud
"brew:ffmpeg" = "latest"
"brew:nss" = "latest"         # lets `mkcert -install` add its CA to Firefox
"brew-cask:azure-cli" = "latest"

# Apps
"brew-cask:docker-desktop" = "latest"
"brew-cask:ghostty" = "latest"
# InstantSpaceSwitcher is installed by tasks/bootstrap: its cask is in a third-party
# tap, which mise can only read with Ruby 3, and macOS ships Ruby 2.6.
# Logi Tune is downloaded by tasks/bootstrap: its cask only opens Logitech's
# installer for you to click through, which mise doesn't support.
"brew-cask:ollama-app" = "latest"
"brew-cask:unnaturalscrollwheels" = "latest"
# Amphetamine. Needs an App Store sign-in, and mas from [tools], so on a new Mac
# it's installed by the second `mise bootstrap`.
"mas:937984704" = "latest"

# Fonts (Operator Mono comes from a private repo; see tasks/bootstrap)
"brew-cask:font-symbols-only-nerd-font" = "latest"

[bootstrap.brew]
adopt = true                  # keep apps already in /Applications instead of replacing them

