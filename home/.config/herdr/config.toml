onboarding = false

[terminal]
shell_mode = "login"

[ui]
status_indicators = "dots"
tab_bar_position = "bottom"
pane_borders = "always"
accent = "blue"
prompt_new_tab_name = false
sidebar_min_width = 32
tab_bar_right_separator = " "
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "cores=$(sysctl -n hw.ncpu); ps -A -o %cpu | awk -v c=\"$cores\" '{s+=$1} END {printf \" %.1f%%\", s/c}'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "vm_stat | awk '/Pages active/ {active=$3} /Pages wired/ {wired=$3} /Pages speculative/ {spec=$3} END { total=active+wired+spec; printf \" %.1fGB\", (total*4096)/(1024^3) }'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = "mem=$(pmset -g batt | grep -Eo \"\\\\d+%\" | cut -d% -f1); echo 󰁽$mem%", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "│ %Y-%m-%d %T" },
]
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "state_text"], ["$ready"]]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch"],
]

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
panel_bg = "reset"

[keys]
settings = "prefix+shift+s"
workspace_picker = "prefix+s"
# switch_workspace = "prefix+shift+1..9"
open_worktree = "prefix+O"
focus_agent = "prefix+shift+1..9"
prefix = "ctrl+space"
goto = "prefix+g"
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
next_agent = "prefix+period"
previous_agent = "prefix+comma"
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
split_horizontal = "prefix+minus"
split_vertical = "prefix+\\"

# Pane navigation
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"

# Pane commands run via `sh -c` with the herdr server's environment, whose PATH
# may not include mise's tools (it depends on how the server was started), so
# they go through a login shell, which adds them via ~/.profile.
# [[keys.command]]
# key = "ctrl+b"
# type = "pane"
# command = "exec bash -lc btop"
# description = "Open btop in pane"

[[keys.command]]
key = "ctrl+g"
type = "pane"
command = "exec bash -lc lazygit"
description = "Open lazygit in current directory"

[[keys.command]]
key = "ctrl+t"
type = "pane"
command = "exec bash -lc 'gh dash'"
description = "Open gh-dash in current directory"

[[keys.command]]
key = "ctrl+n"
type = "pane"
command = "exec bash -lc ranger"
description = "Open ranger in current directory"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+P"
type = "plugin_action"
command = "pipe.board"
description = "pipe: board"

