customCommands:
  - key: "g"
    context: "files"
    description: "AI commit message"
    command: >
      git commit -e -F <(git diff --cached | ollama run qwen2.5-coder:7b "Craft a concise, single sentence, commit message that encapsulates all changes made, with an emphasis on the primary updates. If the modifications share a common theme or scope, mention it succinctly; otherwise, leave the scope out to maintain focus. The goal is to provide a clear and unified overview of the changes in one single message. Don't add any descriptions to the commit, only commit message. Imperitive and concise: present tense, imperative verb first, no trailing period.")
    output: terminal
